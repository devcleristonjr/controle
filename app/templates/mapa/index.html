{% extends 'base.html' %}
{% block title %}Mapa | Estoque Bahia{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}
{% block content %}
<div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
  <div>
    <h1 class="page-title h3 fw-bold mb-1"><i class="bi bi-geo-alt me-2"></i>Mapa da Bahia</h1>
    <p class="text-muted mb-0">Marcadores focados no estado, com filtros dinâmicos.</p>
  </div>
  <div class="d-flex gap-2">
    <div class="stat-mini px-3 py-2"><div class="small text-muted">Total de pontos</div><div class="fw-bold" id="map-total-pontos">0</div></div>
    <div class="stat-mini px-3 py-2"><div class="small text-muted" id="map-total-metric-label">Estoque total</div><div class="fw-bold" id="map-total-banners">0</div></div>
  </div>
</div>

<div class="card card-soft mb-3">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label" for="filter-territorio">Território</label>
        <select id="filter-territorio" class="form-select" aria-label="Território">
          <option value="">Todos</option>
          {% for territorio in territorios %}
            <option value="{{ territorio.id }}">{{ territorio.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="filter-municipio">Município</label>
        <select id="filter-municipio" class="form-select" aria-label="Município">
          <option value="">Todos</option>
          {% for municipio in municipios %}
            <option value="{{ municipio.id }}">{{ municipio.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="filter-material">Material</label>
        <select id="filter-material" class="form-select" aria-label="Material">
          <option value="">Todos</option>
          {% for material in materiais %}
            <option value="{{ material.id }}">{{ material.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label" for="filter-status">Status</label>
        <select id="filter-status" class="form-select" aria-label="Status">
          <option value="">Todos</option>
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
        </select>
      </div>
      <div class="col-md-1 d-grid">
        <button id="map-filter-button" class="btn btn-primary" type="button">Aplicar</button>
      </div>
    </div>
  </div>
</div>

<div id="leaflet-map" class="map-container card-soft"></div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
{% endblock %}
